<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Zelda: A Link to the Past</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #001122 0%, #002244 50%, #001122 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #FFD700;
        }
        canvas {
            border: 4px solid #8B7D6B;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #8B7D6B;
        }
        #ui {
            color: #FFD700;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #8B7D6B;
        }
        #ui span {
            color: #00FF00;
        }
        #instructions {
            color: #D3D3D3;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #555;
        }
        .title {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="title">The Legend of Zelda: A Link to the Past - 3D Remaster</div>
        <canvas id="gameCanvas" width="512" height="448"></canvas>
        <div id="ui">
            <div>❤️ Health: <span id="health">3/3</span> | 💎 Rupees: <span id="rupees">0</span> | 🏰 Level: <span id="level">Light World - Eastern Palace</span></div>
        </div>
        <div id="instructions">
            🎮 Click to enter first-person mode • WASD to move • Mouse to look • SHIFT to run • SPACE to attack • E to interact
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/input.js"></script>
    <script src="js/renderer3d.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/item.js"></script>
    <script src="js/level.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
