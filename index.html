<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Zelda: A Link to the Past</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        canvas {
            border: 2px solid #333;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui {
            color: white;
            margin-top: 10px;
            font-size: 14px;
        }
        #instructions {
            color: #ccc;
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="512" height="448"></canvas>
        <div id="ui">
            <div>Health: <span id="health">3/3</span> | Rupees: <span id="rupees">0</span> | Level: <span id="level">Light World - Eastern Palace</span></div>
        </div>
        <div id="instructions">
            Use WASD or Arrow Keys to move, SPACE to attack, E to interact
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/input.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/item.js"></script>
    <script src="js/level.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
